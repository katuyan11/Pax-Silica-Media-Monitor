name: Daily News Fetch

on:
  schedule:
    # 7:00 AM Manila = 11:00 PM UTC
    # RSS + World News API
    - cron: '0 23 * * *'

    # 10:00 AM Manila = 2:00 AM UTC
    # RSS only
    - cron: '0 2 * * *'

    # 1:00 PM Manila = 5:00 AM UTC
    # RSS only
    - cron: '0 5 * * *'

    # 4:00 PM Manila = 8:00 AM UTC
    # RSS only
    - cron: '0 8 * * *'

    # 7:00 PM Manila = 11:00 AM UTC
    # RSS + World News API
    - cron: '0 11 * * *'

    # 10:00 PM Manila = 2:00 PM UTC
    # RSS only
    - cron: '0 14 * * *'

  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fetch script
        env:
          WORLD_NEWS_API_KEY: ${{ secrets.WORLD_NEWS_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

          # World News API runs ONLY at 7 AM and 7 PM Manila time.
          # All other scheduled runs are RSS-only.
          RUN_WORLD_NEWS: ${{ github.event.schedule == '0 23 * * *' || github.event.schedule == '0 11 * * *' }}

          # Set to "true" temporarily for a one-time historical backfill.
          # Leave as "false" for normal daily news collection.
          BACKFILL: "false"

        run: python fetch_and_append.py
